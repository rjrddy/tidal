name: Tidal gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make setup lint test bench scan
      - run: docker build -t tidal:test .
      - run: python3 scripts/container_smoke.py
      - run: .venv/bin/pip install -r requirements-browser.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium ffmpeg
      - run: .venv/bin/python scripts/review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tidal-runtime-evidence
          path: docs/results/
